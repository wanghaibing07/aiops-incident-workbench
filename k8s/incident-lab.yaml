# Minimal reproducible topology reconstructed from LOG-053.
# This is not a byte-for-byte export of the live cluster.
# Contains no credentials and does not configure Agent RBAC.
apiVersion: v1
kind: Namespace
metadata:
  name: incident-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: t3-gateway-config
  namespace: incident-lab
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_pass http://t1-web.incident-lab.svc.cluster.local:80/;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t1-web
  namespace: incident-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t1-web
  template:
    metadata:
      labels:
        app: t1-web
    spec:
      containers:
        - name: t1-web
          image: nginx:1.25
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: t1-web
  namespace: incident-lab
spec:
  selector:
    app: t1-web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: t3-gateway
  namespace: incident-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: t3-gateway
  template:
    metadata:
      labels:
        app: t3-gateway
    spec:
      containers:
        - name: t3-gateway
          image: nginx:1.25
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: nginx-config
          configMap:
            name: t3-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: t3-gateway
  namespace: incident-lab
spec:
  selector:
    app: t3-gateway
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
